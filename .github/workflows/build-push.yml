name: Build and Push Docker Images

on: push
#  push:
#    branches:
#      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.WRITE_PACKAGE_TOKEN }}

      - name: Build and push llsp-worker Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          file: ./LLSP-Worker/Dockerfile
          push: true
          context: ./LLSP-Worker
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/llsp-worker

      - name: Checkout the Gitops repository
        uses: actions/checkout@v5
        with:
          repository: fiaisis/gitops
          token: ${{ secrets.GITOPS_STAGING_EDIT_TOKEN }}

      - name: Edit the YAML llsp-worker file for staging
        uses: mikefarah/yq@v4.47.1
        with:
          cmd: yq e -i '.spec.template.spec.containers[] |= select(.name == "llsp-worker").image = "ghcr.io/fiaisis/llsp-worker@${{ steps.docker_build.outputs.digest }}"' './components/llsp-worker/envs/staging/llsp-worker.yml'

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -am "[CD] Update llsp-worker with this commit ${{ github.event.head_commit.url}}"
          git push

  build-and-push-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.WRITE_PACKAGE_TOKEN }}

      - name: Build and push llsp-api Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          file: ./LLSP-API/Dockerfile
          push: true
          context: ./LLSP-API
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/llsp-api
