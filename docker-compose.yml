services:
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: llsp
      RABBITMQ_DEFAULT_PASS: llsp
      RABBITMQ_DEFAULT_VHOST: llspvhost
    ports:
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./LLSP-API
    environment:
      CELERY_BROKER_URL: amqp://llsp:llsp@rabbitmq:5672/llspvhost
      CELERY_RESULT_BACKEND: rpc://
      EXEC_TASK_NAME: celery_app.exec_script
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/docs > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24

  worker:
    build: ./LLSP-Worker
    environment:
      RABBITMQ_USER: llsp
      RABBITMQ_PASS: llsp
      CELERY_BROKER_HOST: rabbitmq
      CELERY_RESULT_BACKEND: rpc://
      OUTPUT_DIR: /outputs
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - outputs:/outputs

  e2e-tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      OUTPUT_PATH: /outputs
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    volumes:
      - outputs:/outputs

volumes:
  outputs:
